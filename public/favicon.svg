<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120326" />
      <stop offset="50%" stop-color="#2D0B5A" />
      <stop offset="100%" stop-color="#120326" />
    </linearGradient>
    <linearGradient id="nk-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15DEC0" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D946EF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background container rounded squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#glow-grad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Monogram NutrinK (N + K) -->
  <g filter="url(#glow)">
    <!-- Left Vertical Bar of N -->
    <path d="M 22 26 C 22 22, 30 22, 30 26 L 30 74 C 30 78, 22 78, 22 74 Z" fill="url(#nk-ribbon)" />

    <!-- Diagonal ribbon of N extending upward into K -->
    <path d="M 30 26 L 50 64 L 50 26 C 50 22, 58 22, 58 26 L 58 74 C 58 78, 50 78, 50 74 L 30 36 Z" fill="url(#nk-ribbon)" />

    <!-- Upper Diagonal Arm of K -->
    <path d="M 50 48 L 74 24 C 78 20, 84 25, 80 30 L 60 52 Z" fill="url(#nk-ribbon)" />

    <!-- Lower Diagonal Leg of K -->
    <path d="M 55 48 L 79 74 C 83 78, 76 84, 71 80 L 48 55 Z" fill="url(#nk-ribbon)" />

    <!-- AI Nutria Sparkle indicator -->
    <circle cx="78" cy="22" r="3.5" fill="#15DEC0" />
  </g>
</svg>
